name: Build & Deploy RSV Schwalbe Ellmendingen

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Astro Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Site (dist/)
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rsv-schwalbe-dist
          path: dist/
          retention-days: 7

  # ============================================================================
  # OPTION A: Automatisches FTP/FTPS-Deployment (Netcup / Hetzner / IONOS)
  # Aktiviert sich automatisch, sobald das Secret FTP_SERVER in GitHub hinterlegt ist.
  # ============================================================================
  deploy-ftp:
    name: Deploy via FTPS (Webhosting)
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.ENABLE_FTP_DEPLOY == 'true'
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: rsv-schwalbe-dist
          path: dist/

      - name: Upload to Webspace via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_TARGET_DIR || './' }}
          protocol: ftps

